<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Market Analysis on News Sentiments</title>
  <desc id="desc">Research notebooks connect ticker-level news summaries and technical indicators to model comparisons. Training spans 2018 to 2022, testing 2023, and out-of-sample analysis 2024 onward. This is a workflow illustration, not a performance chart.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101f2c"/><stop offset="1" stop-color="#182b32"/></linearGradient><pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#87b2b1" stroke-opacity=".08"/></pattern></defs>
  <rect width="1200" height="700" fill="url(#bg)"/><rect width="1200" height="700" fill="url(#grid)"/>
  <g font-family="Arial, sans-serif"><text x="66" y="82" fill="#b8c9c7" font-size="17" letter-spacing="3">PRANAV PATEL / QUANTITATIVE RESEARCH</text><text x="66" y="151" fill="#f5f3e8" font-size="47" font-weight="700">Market Analysis</text><text x="66" y="207" fill="#d3b77d" font-size="47" font-weight="700">on News Sentiments</text><text x="66" y="248" fill="#a8bfbd" font-size="20">Ticker-level context. Comparative models. Historical backtests.</text>
  <g fill="#20363d" stroke="#648780" stroke-width="1.5"><rect x="66" y="308" width="299" height="170" rx="12"/><rect x="450" y="308" width="299" height="170" rx="12"/><rect x="834" y="308" width="299" height="170" rx="12"/></g>
  <path d="M378 393h58m-13-10 13 10-13 10M762 393h58m-13-10 13 10-13 10" fill="none" stroke="#d3b77d" stroke-width="2"/>
  <g fill="#d3b77d" font-size="15" letter-spacing="2"><text x="91" y="345">01 / CONTEXT</text><text x="475" y="345">02 / FEATURES</text><text x="859" y="345">03 / COMPARISON</text></g>
  <g fill="#eef0e8" font-size="27" font-weight="700"><text x="91" y="388">News summaries</text><text x="475" y="388">Market indicators</text><text x="859" y="388">Model backtests</text></g>
  <g fill="#a8bfbd" font-size="18"><text x="91" y="421">Positive · neutral · negative</text><text x="91" y="451">Daily, per-ticker CSVs</text><text x="475" y="421">SMA · EMA · volatility</text><text x="475" y="451">Historical price features</text><text x="859" y="421">Logit · trees · RF · XGBoost</text><text x="859" y="451">Saved plots and exports</text></g>
