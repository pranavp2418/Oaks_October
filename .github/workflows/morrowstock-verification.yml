name: MorrowStock verification
on:
  push:
    branches: [main]
    paths:
      - 'Oaks_October/2026-10-14-MorrowStock/**'
      - '.github/workflows/morrowstock-verification.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: Oaks_October/2026-10-14-MorrowStock
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: cmp requirements.txt requirements.lock
      - run: pip install -r requirements.txt
      - run: python3 -m unittest discover -s tests -v
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
      - run: python3 benchmark.py
