name: October 13 project verification
on:
  push:
    branches: [main]
    paths:
      - 'Oaks_October/2026-10-13-Loadstone/**'
      - 'Oaks_October/2026-10-13-PatchBay/**'
      - 'Oaks_October/2026-10-13-ProofHarbor/**'
      - '.github/workflows/october-13-verification.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  loadstone:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: Oaks_October/2026-10-13-Loadstone
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm test
  patchbay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: Oaks_October/2026-10-13-PatchBay
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - run: python3 tools/dependencies.py
      - run: python3 tools/build.py
      - run: python3 tests/verify.py
  proofharbor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: Oaks_October/2026-10-13-ProofHarbor
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python3 -m unittest discover -s tests -v
      - run: npm ci --ignore-scripts
      - run: npm run build
