name: Wirewake verification
on:
  push:
    branches: [main]
    paths: ['Oaks_October/2026-10-14-Wirewake/**', '.github/workflows/wirewake-verification.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: Oaks_October/2026-10-14-Wirewake
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '24'}
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: WIREWAKE_GO="$PWD/.toolchain/go/bin/go" npm test
      - run: WIREWAKE_GO="$PWD/.toolchain/go/bin/go" npm run benchmark
