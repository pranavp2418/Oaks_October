name: October 15 agent verification
on:
  push:
    branches: [main]
    paths:
      - 'Oaks_October/2026-10-15-*/**'
      - '.github/workflows/october-15-verification.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lintel:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: Oaks_October/2026-10-15-Lintel
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python3 -m unittest discover -s tests -v
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: python3 benchmark.py
  portwise:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: Oaks_October/2026-10-15-Portwise
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
  fallow:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: Oaks_October/2026-10-15-Fallow
    env:
      RUSTUP_TOOLCHAIN: 1.99.1
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: rustup toolchain install 1.99.1 --profile minimal --target wasm32-unknown-unknown
      - run: cargo test --manifest-path engine/Cargo.toml --locked
      - run: cargo build --manifest-path engine/Cargo.toml --locked --release
      - run: python3 tests/oracle.py
      - run: bash tools/build-wasm.sh --check
      - run: node tests/wasm-parity.mjs
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
